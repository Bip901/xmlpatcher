[project]
name = "xmlpatcher"
version = "1.0.4"
authors = [
  { name = "Bip901", email = "74911767+Bip901@users.noreply.github.com" },
]
description = "A convenient library for patching XML files with XPath."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = ["lxml>=6,<7"]

[dependency-groups]
dev = ["lxml-stubs", "mypy>=2.1.0", "ruff>=0.15.20"]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[project.urls]
"Homepage" = "https://github.com/Bip901/xmlpatcher"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "F",     # pyflakes
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "RUF",   # ruff
  "I",     # isort
  "N",     # pep8-naming
  "D417",  # pydocstyle: missing argument description
  "UP",    # pyupgrade
  "A",     # flake8-builtins
  "ANN",   # flake8-annotations
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "EXE",   # flake8-executable
  "INP",   # flake8-no-pep420
  "LOG",   # flake8-logging
  "PIE",   # flake8-pie
  "PTH",   # flake8-use-pathlib
  "RET",   # flake8-return
  "SIM",   # flake8-simplify
  "TC",    # flake8-type-checking
  "YTT",   # flake8-2020
] # https://docs.astral.sh/ruff/rules/

[tool.mypy]
strict = true
